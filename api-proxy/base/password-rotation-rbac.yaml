apiVersion: v1
kind: ServiceAccount
metadata:
  name: password-rotator
  namespace: api-proxy

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: api-proxy
  name: password-rotator-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: password-rotator-binding
  namespace: api-proxy
subjects:
- kind: ServiceAccount
  name: password-rotator
  namespace: api-proxy
roleRef:
  kind: Role
  name: password-rotator-role
  apiGroup: rbac.authorization.k8s.io
