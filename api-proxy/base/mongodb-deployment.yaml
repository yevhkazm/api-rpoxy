apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: mongodb
  name: mongodb
  namespace: api-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6-jammy
        imagePullPolicy: Always
        env:
          - name: MONGO_INITDB_DATABASE
            value: api-proxy
          - name: MONGO_PORT
            value: "27017"
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
        ports:
            - containerPort: 27017
              protocol: TCP
      volumes:
        - name: dbdata6
          persistentVolumeClaim:
            claimName: dbdata6
        - name: mongodb-secret
          secret:
            secretName: mongodb-secret
